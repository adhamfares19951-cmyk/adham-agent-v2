version: '3.8'

services:
  adham-agent:
    build: .
    container_name: adham-agent
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Gaza
    env_file:
      - .env
    volumes:
      # Persistent SQLite database, sessions vault, crash dumps, and git cache
      - ./agent_memory.db:/app/agent_memory.db
      - ./sessions:/app/sessions
      - ./crash_dumps:/app/crash_dumps
      - ./repos_cache:/app/repos_cache
      - ./watchdog.log:/app/watchdog.log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
